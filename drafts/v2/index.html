<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shawnys Captures · Wedding photography in Singapore</title>
<meta name="description" content="Shawn Sim photographs weddings, pre-weddings, families and events in Singapore. Draft v0.3.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.myportfolio.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&family=Wittgenstein:ital,wght@0,400..500;1,400..500&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="landing.css">
</head>
<body>
<!-- The bar. On the opening it is the strip across the full-screen photograph: transparent, pale type, only
     Rates and Enquire. As the photograph scrolls away it turns into the tab bar (paper, dark type, the categories
     opening up) and stays at the top from there on. site.js drives --bar from 0 (strip) to 1 (tab bar). -->
<header class="bar" id="bar">
  <div class="container bleed">
    <a class="bar-logo" href="#/" aria-label="Shawnys Captures, home"><img class="light-ink" src="../../public/assets/shawnys-logo-linen.png" width="1000" height="747" alt=""><img class="dark-ink" src="../../public/assets/shawnys-logo-darkroom.png" width="1000" height="747" alt=""></a>
    <span class="rule" aria-hidden="true"></span>
    <div class="tabs-wrap">
      <nav aria-label="Main"><ul id="tabs">
        <li><a class="tab" href="#/weddings">Weddings</a></li><li><a class="tab" href="#/family">Family</a></li>
        <li><a class="tab" href="#/events">Events</a></li><li><a class="tab" href="#/others">Others</a></li>
        <li><a class="tab" href="#/faq">FAQ</a></li>
      </ul></nav>
    </div>
    <div class="bar-end">
      <a class="tab" href="#/rates">Rates</a>
      <a class="tab ask" href="#/enquire">Enquire</a>
    </div>
  </div>
</header>

<!-- Soft edges, the design portfolio's EdgeBlur: whatever scrolls toward the foot of the screen goes out of
     focus instead of being cut off. Six stacked backdrop blurs, each twice the one before, each masked to its own band. -->
<div class="edge-blur bottom" aria-hidden="true"><div style="--k:0.03125;--a:25.0%"></div><div style="--k:0.06250;--a:37.5%"></div><div style="--k:0.12500;--a:50.0%"></div><div style="--k:0.25000;--a:62.5%"></div><div style="--k:0.50000;--a:75.0%"></div><div style="--k:1.00000;--a:87.5%"></div></div>

<!-- The cursor, the design portfolio's (cursor.js): a small grey square that becomes an icon over some things. -->
<div class="cursor" aria-hidden="true" data-cursor-el>
  <span class="dot"></span>
  <span class="c-back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span>
  <span class="c-view"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg></span>
  <span class="c-prev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></span>
  <span class="c-next"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
</div>

<!-- the wall: a moving wash of orange light (light.js), then paper pulp over it. Both sit behind everything. -->
<canvas class="light" id="light" aria-hidden="true"></canvas>
<div class="sheet" aria-hidden="true"></div>

<!-- The opening (home only): paper with the logo and one line, the photograph showing through a small aperture.
     Scrolling opens the aperture until the photograph fills the screen; the bar above turns into the tab bar. -->
<section class="intro" id="intro">
  <div class="intro-pin">
    <div class="intro-paper">
      <div class="pages"></div>
      <span class="intro-cue" aria-hidden="true">Scroll</span>
    </div>
    <section class="hero" id="hero" aria-label="Photographs from selected albums">
    </section>
  </div>
</section>

<main tabindex="-1">
  <!-- always under the bar on the home tabs; the copy and the picture follow the open tab -->
  <section class="about container bleed" id="about" aria-label="About Shawn">
    <!-- Shawn's portrait, big enough to know him by, beside a greeting and the tab's words (set like a review) -->
    <figure class="about-card">
      <span class="about-face box" id="aboutPic"></span>
      <div><p class="about-hello">Hello, I’m Shawn!</p><div class="about-text" id="aboutText"></div></div>
    </figure>
  </section>

  <div id="content"></div>

  <section class="closing container bleed" id="closing">
    <div class="closing-box">
      <div class="closing-text">
        <h2 id="closingHead">No package that fits your plans? I’m flexible, and happy to tailor one to your occasion.</h2>
        <p id="closingText"></p>
        <div class="row"><a class="pill primary large" href="#/enquire">Enquire</a></div>
      </div>
    </div>
  </section>
</main>

<!-- The footer, the design portfolio's: one quiet band under a hairline. The mark and a line that types itself
     ("let's ..."), over a row of text links (↗ for those that leave the site); the credit on the right. -->
<footer class="site-footer">
  <div class="container bleed band">
    <div class="hello">
      <p class="lets">
        <span class="visually-hidden">Let's find your good light.</span>
        <span class="typed" aria-hidden="true" data-phrases='["find your good light","have a chat","plan your day"]'>let’s <span data-type>find your good light</span><span class="caret"></span></span>
      </p>
      <ul class="arrow-links" id="footLinks" aria-label="Get in touch"></ul>
    </div>
    <p class="credit">© Shawnys Captures 2026</p>
  </div>
</footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photograph viewer">
  <div class="v-top"><span id="vTitle"></span><span class="count" id="vCount" aria-live="polite"></span><button type="button" id="vClose">Close</button></div>
  <div class="v-stage">
    <span class="v-wait" aria-hidden="true"></span>
    <!-- the two halves of the photograph turn it, as the arrows do; the cursor shows which way (cursor.js) -->
    <div class="v-zone" data-cursor="prev" aria-hidden="true"></div><div class="v-zone" data-cursor="next" aria-hidden="true"></div>
    <img id="vImg" alt="">
    <div class="v-nav">
      <button type="button" id="vPrev" aria-label="Previous photograph"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3M7 4 3 8l4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" id="vNext" aria-label="Next photograph"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</div>

<script type="module" src="site.js"></script>
<script type="module" src="cursor.js"></script>
</body>
</html>
